spring.application.name=loan-management-api
spring.datasource.url=jdbc:h2:mem:loans;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.cache.type=caffeine
spring.cache.cache-names=loansByUser,allLoans
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=5m
security.jwt.secret=change-this-secret-key-to-a-long-value-at-least-32-bytes
security.jwt.expiration-ms=3600000
server.port=8080
