<main class="page"><header><div><h1>Panel administrativo</h1><p>Revisa y decide las solicitudes pendientes.</p></div><button class="secondary" (click)="auth.logout()">Salir</button></header><section class="card"><div class="table"><div class="row head"><span>ID</span><span>Usuario</span><span>Monto</span><span>Plazo</span><span>Estado</span><span>Acciones</span></div><div class="row" *ngFor="let l of loans"><span>#{{l.id}}</span><span>{{l.userEmail}}</span><span>{{l.amount | currency:'COP':'symbol-narrow':'1.0-0'}}</span><span>{{l.termMonths}} meses</span><strong>{{l.status}}</strong><span class="actions"><button *ngIf="l.status==='PENDING'" (click)="change(l.id,'APPROVED')">Aprobar</button><button class="danger" *ngIf="l.status==='PENDING'" (click)="change(l.id,'REJECTED')">Rechazar</button></span></div></div></section></main>
