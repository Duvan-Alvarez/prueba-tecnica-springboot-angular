<main class="page"><header><div><h1>Mis préstamos</h1><p>Consulta tus solicitudes y crea una nueva.</p></div><button class="secondary" (click)="auth.logout()">Salir</button></header><section class="grid"><article class="card"><h2>Nueva solicitud</h2><form [formGroup]="form" (ngSubmit)="submit()"><label>Monto<input type="number" formControlName="amount"></label><label>Plazo en meses<input type="number" formControlName="termMonths"></label><button>Solicitar préstamo</button></form><p class="success">{{message}}</p></article><article class="card"><h2>Historial</h2><div *ngIf="loans.length===0" class="muted">No tienes solicitudes.</div><div class="loan" *ngFor="let l of loans"><div><b>#{{l.id}}</b><span>{{l.amount | currency:'COP':'symbol-narrow':'1.0-0'}}</span></div><div><span>{{l.termMonths}} meses</span><strong [class]="l.status.toLowerCase()">{{l.status}}</strong></div></div></article></section></main>
